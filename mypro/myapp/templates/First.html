<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Page</title>
</head>
<body>

    <h1>First Page</h1>

    <table border="1">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Place</th>
            </tr>
            {% for i in data %}
            <tr>
                <td>{{ i.name }}</td>
                <td>{{ i.age }}</td>
                <td>{{ i.place }}</td>
            </tr>
            {% endfor %}
    </table>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Movie List Details</h1>

        <table border="1">
            <tr>
                <th>Name</th>
                <th>Director</th>
                <th>Year</th>
            </tr>
            {% for i in movies %}
            <tr>
                <td>{{ i.name }}</td>
                <td>{{ i.director }}</td>
                <td>{{ i.year }}</td>
            </tr>
            {% endfor %}
    </table>
    
</body>
</html>

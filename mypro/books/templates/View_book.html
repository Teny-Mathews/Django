<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>View Book Details</h1>

        <table border="1">
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Language</th>
                <th>Pages</th>
            </tr>
            {% for i in books %}
            <tr>
                <td>{{ i.title }}</td>
                <td>{{ i.author }}</td>
                <td>{{ i.price }}</td>
                <td>{{ i.language }}</td>
                <td>{{ i.pages }}</td>
            </tr>
            {% endfor %}
    </table>
    
</body>
</html>
